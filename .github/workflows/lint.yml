name: Lint and Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src --ext .ts,.tsx --report-unused-disable-directives --max-warnings 0 || echo "ESLint not configured, skipping"

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Check for unused files
        run: |
          find src -type f -name "*.tsx" -o -name "*.ts" | wc -l | xargs echo "TypeScript files count:"

      - name: Verify project structure
        run: |
          [ -f "package.json" ] && echo "✅ package.json exists" || exit 1
          [ -f "tsconfig.json" ] && echo "✅ tsconfig.json exists" || exit 1
          [ -f "vite.config.ts" ] && echo "✅ vite.config.ts exists" || exit 1
          [ -d "src" ] && echo "✅ src directory exists" || exit 1
          [ -d "src/components" ] && echo "✅ components directory exists" || exit 1
          [ -d "src/pages" ] && echo "✅ pages directory exists" || exit 1
          [ -d "src/data" ] && echo "✅ data directory exists" || exit 1
