name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t upskills-in:${{ github.sha }} .
          docker tag upskills-in:${{ github.sha }} upskills-in:latest

      # Vercel deployment (uncomment and configure if using Vercel)
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

      # Netlify deployment (uncomment and configure if using Netlify)
      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3.0
      #   with:
      #     publish-dir: './dist'
      #     production-branch: main
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     deploy-message: "Deploy from GitHub Actions"
      #     enable-pull-request-comment: false
      #     enable-commit-comment: true
      #     overwrites-pull-request-comment: true
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Docker Hub deployment
      - name: Login to Docker Hub
        if: github.event.inputs.docker_hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event.inputs.docker_hub == 'true'
        run: |
          docker tag upskills-in:${{ github.sha }} ${{ secrets.DOCKER_HUB_USERNAME }}/upskills-in:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/upskills-in:latest

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Docker image: upskills-in:${{ github.sha }}"
          echo ""
          echo "To deploy locally:"
          echo "  docker-compose up -d"
          echo ""
          echo "To deploy to production, update the workflow with your preferred hosting provider credentials."
